<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Registration — SGS</title><link rel="stylesheet" href="css/style.css">
</head><body data-page="register"><div id="navbar"></div>
<header class="page-hero"><span class="section-kicker">STEP 01 / 03</span><h1>REGISTER <em id="game-name">YOUR TEAM</em></h1><p>Enter the team captain details and submit your registration request.</p></header>
<main class="content-section"><div class="glass">
<form data-demo>
<div class="info-grid" style="grid-template-columns:1fr 1fr">
<div class="form-group"><label>Team Name</label><input class="form-control" required placeholder="e.g. Blue Lions"></div>
<div class="form-group"><label>Captain Name</label><input class="form-control" required placeholder="Full name"></div>
<div class="form-group"><label>Email</label><input type="email" class="form-control" required placeholder="captain@example.com"></div>
<div class="form-group"><label>Phone</label><input class="form-control" required placeholder="+92 3xx xxxxxxx"></div>
</div>
<div class="form-group"><label>Player Count</label><select class="form-control"><option>5 Players</option><option>7 Players</option><option>11 Players</option></select></div>
<div style="display:flex;justify-content:flex-end"><button class="btn btn-primary form-submit" type="submit">Continue Registration ↗</button></div>
<div class="success-box">Registration details captured successfully in this frontend demo. Connect the form to your backend/API to persist it.</div>
</form></div></main><div id="footer"></div><script>
const params=new URLSearchParams(location.search); const game=params.get("game")||"TEAM"; document.getElementById("game-name").textContent=game.toUpperCase();
</script><script src="js/app.js"></script></body></html>
